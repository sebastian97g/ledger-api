version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ledger", "-pledger"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ledger-net

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ledger-net

  ledger-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ledger
      DB_PASS: ledger
      KAFKA_BOOTSTRAP: kafka:9092
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ledger-net

  ledger-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ledger
      DB_PASS: ledger
      KAFKA_BOOTSTRAP: kafka:9092
      PORT: 8081
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ledger-net

networks:
  ledger-net:
    driver: bridge
